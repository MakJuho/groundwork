  <g stroke="#8B95A1" stroke-width="2" marker-end="url(#a)">
    <line x1="161" y1="238" x2="181" y2="238"/>
    <line x1="324" y1="238" x2="344" y2="238"/>
    <line x1="487" y1="238" x2="507" y2="238"/>
    <line x1="650" y1="238" x2="670" y2="238"/>
    <line x1="813" y1="238" x2="833" y2="238"/>
  </g>

  <rect x="20" y="300" width="14" height="14" rx="3" fill="#3182F6"/>
  <text x="42" y="312" font-size="12.5" fill="#4E5968">Claude</text>
  <rect x="110" y="300" width="14" height="14" rx="3" fill="#D1D6DB"/>
  <text x="132" y="312" font-size="12.5" fill="#4E5968">스크립트</text>
  <rect x="210" y="300" width="14" height="14" rx="3" fill="#B7EBD2"/>
  <text x="232" y="312" font-size="12.5" fill="#4E5968">사람</text>
