    <text x="579" y="255" font-size="11.5" fill="#4E5968">LOA-002는 계속 LOA-002</text>

    <rect x="672" y="203" width="140" height="70" rx="12" fill="#F2F4F6"/>
    <text x="742" y="235" font-weight="700" fill="#191F28">전체 재검증</text>
    <text x="742" y="255" font-size="11.5" fill="#4E5968">밀린 줄 번호까지</text>

    <rect x="835" y="203" width="144" height="70" rx="12" fill="#3182F6"/>
    <text x="907" y="235" font-weight="700" fill="#FFFFFF">변경 내역 게시</text>
    <text x="907" y="255" font-size="11.5" fill="#E8F3FF">3권 → 5권 · 커밋</text>
