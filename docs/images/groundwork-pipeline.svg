    <text x="253" y="235" font-weight="700" fill="#191F28">영향 범위 계산</text>
    <text x="253" y="255" font-size="11.5" fill="#4E5968">바뀐 파일 → 모듈 · 흐름</text>

    <rect x="346" y="203" width="140" height="70" rx="12" fill="#E8F3FF"/>
    <text x="416" y="235" font-weight="700" fill="#1B64DA">부분 재분석</text>
    <text x="416" y="255" font-size="11.5" fill="#4E5968">영향받은 곳만</text>

    <rect x="509" y="203" width="140" height="70" rx="12" fill="#F2F4F6"/>
