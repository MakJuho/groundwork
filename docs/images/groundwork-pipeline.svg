  <text x="20" y="185" font-size="15" font-weight="700" fill="#191F28">코드가 바뀌었을 때 <tspan font-weight="400" font-size="13" fill="#6B7684">· 바뀐 부분만</tspan></text>

  <g font-size="13.5" text-anchor="middle">
    <rect x="20" y="203" width="140" height="70" rx="12" fill="#F2F4F6"/>
