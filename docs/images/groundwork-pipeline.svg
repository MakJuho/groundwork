<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B95A1"/>
    </marker>
  </defs>
  <rect width="1000" height="330" fill="#FFFFFF"/>

  <text x="20" y="32" font-size="15" font-weight="700" fill="#191F28">처음 분석할 때</text>

  <!-- step boxes: x = 20 + i*122, w=105 -->
  <g font-size="13.5" text-anchor="middle">
    <rect x="20" y="50" width="105" height="70" rx="12" fill="#F2F4F6"/>
    <text x="72" y="82" font-weight="700" fill="#191F28">준비</text>
    <text x="72" y="102" font-size="11.5" fill="#4E5968">테스트 코드 제외</text>

    <rect x="142" y="50" width="105" height="70" rx="12" fill="#F2F4F6"/>
    <text x="194" y="82" font-weight="700" fill="#191F28">구조 스캔</text>
    <text x="194" y="102" font-size="11.5" fill="#4E5968">모듈 지도 만들기</text>

    <rect x="264" y="50" width="105" height="70" rx="12" fill="#E5F8EF"/>
    <text x="316" y="82" font-weight="700" fill="#191F28">모듈 확인</text>
    <text x="316" y="102" font-size="11.5" fill="#4E5968">사람이 고침</text>

    <rect x="386" y="50" width="105" height="70" rx="12" fill="#E8F3FF"/>
