    <text x="438" y="102" font-size="11.5" fill="#4E5968">근거와 함께 추출</text>

    <rect x="508" y="50" width="105" height="70" rx="12" fill="#E8F3FF"/>
    <text x="560" y="82" font-weight="700" fill="#1B64DA">흐름 추적</text>
    <text x="560" y="102" font-size="11.5" fill="#4E5968">요청 하나 따라가기</text>

    <rect x="630" y="50" width="105" height="70" rx="12" fill="#E8F3FF"/>
    <text x="682" y="82" font-weight="700" fill="#1B64DA">문서 생성</text>
    <text x="682" y="102" font-size="11.5" fill="#4E5968">정책서 · 다이어그램</text>

    <rect x="752" y="50" width="105" height="70" rx="12" fill="#F2F4F6"/>
