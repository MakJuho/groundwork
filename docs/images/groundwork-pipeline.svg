    <text x="926" y="102" font-size="11.5" fill="#E8F3FF">포털에 반영</text>
  </g>
  <g stroke="#8B95A1" stroke-width="2" marker-end="url(#a)">
    <line x1="126" y1="85" x2="140" y2="85"/>
    <line x1="248" y1="85" x2="262" y2="85"/>
    <line x1="370" y1="85" x2="384" y2="85"/>
    <line x1="492" y1="85" x2="506" y2="85"/>
    <line x1="614" y1="85" x2="628" y2="85"/>
    <line x1="736" y1="85" x2="750" y2="85"/>
